{{ $hotel := hugo.Data.hotel }}
{{ $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) }}
{{ $description := .Params.description | default site.Params.description }}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ $title }}</title>
<meta name="description" content="{{ $description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="{{ $hotel.name }}">
<meta name="twitter:card" content="summary_large_image">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Hotel",
  "name": "{{ $hotel.name }}",
  "legalName": "{{ $hotel.legal_name }}",
  "description": "{{ $hotel.og_description }}",
  "telephone": "{{ $hotel.phone }}",
  {{ with $hotel.email }}"email": "{{ . }}",{{ end }}
  "starRating": {
    "@type": "Rating",
    "ratingValue": "3"
  },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ $hotel.address.street }}",
    "addressLocality": "{{ $hotel.address.locality }}",
    "addressRegion": "{{ $hotel.address.region }}",
    "postalCode": "{{ $hotel.address.postal_code }}",
    "addressCountry": "{{ $hotel.address.country }}"
  },
  "url": "{{ site.BaseURL }}"
  {{ if or $hotel.facebook_url $hotel.instagram_url $hotel.linkedin_url }},
  "sameAs": [
    {{ $links := slice }}
    {{ with $hotel.facebook_url }}{{ $links = $links | append . }}{{ end }}
    {{ with $hotel.instagram_url }}{{ $links = $links | append . }}{{ end }}
    {{ with $hotel.linkedin_url }}{{ $links = $links | append . }}{{ end }}
    {{ range $i, $link := $links }}{{ if $i }},{{ end }}"{{ $link }}"{{ end }}
  ]
  {{ end }}
}
</script>
