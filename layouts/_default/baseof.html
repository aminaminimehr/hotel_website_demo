<!doctype html>
<html lang="{{ site.LanguageCode }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ partial "header.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ $lightbox := resources.Get "js/lightbox.js" | minify | fingerprint }}
    <script src="{{ $lightbox.RelPermalink }}" defer></script>
  </body>
</html>
